services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trdizin_live}
      MYSQL_USER: ${MYSQL_USER:-trdizin_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    build:
      context: ./database
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trdizin_live}
      MYSQL_USER: ${MYSQL_USER:-trdizin_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  grobid:
    image: lfoppiano/grobid:0.8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8070:8070"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8070 &&
          printf 'GET /api/isalive HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'true' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  interface:
    build:
      context: ./interface
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      grobid:
        condition: service_healthy
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TRDIZIN_BASE_URL: ${TRDIZIN_BASE_URL:-https://search.trdizin.gov.tr}
      GROBID_URL: ${GROBID_URL:-http://grobid:8070}
      EXTERNAL_CONNECT_TIMEOUT: ${EXTERNAL_CONNECT_TIMEOUT:-10}
      EXTERNAL_READ_TIMEOUT: ${EXTERNAL_READ_TIMEOUT:-120}
      MAX_PDF_BYTES: ${MAX_PDF_BYTES:-52428800}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trdizin_live}
      MYSQL_USER: ${MYSQL_USER:-trdizin_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PERSISTENCE_ENABLED: ${PERSISTENCE_ENABLED:-true}
      GROBID_VERSION: ${GROBID_VERSION:-0.8.0}
      ALGORITHM_VERSION: ${ALGORITHM_VERSION:-live-matcher-v1}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
