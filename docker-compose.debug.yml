services:
  interface:
    build:
      context: ./interface
      dockerfile: Dockerfile.debug
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - ./interface:/app
    command:
      - python
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5678
      - -m
      - uvicorn
      - app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
